name: 持續整合

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 型別、測試與建置
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 設定 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
          cache: npm

      - name: 安裝鎖定版本的相依套件
        run: npm ci

      - name: TypeScript 型別檢查
        run: npm run typecheck

      - name: 程式碼規則檢查
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: 標記既有 lint 技術債
        if: steps.lint.outcome == 'failure'
        run: echo "::warning::Lint 仍有既有技術債；目前會顯示報告，但暫不阻擋 CI。"

      - name: Google Sheets MCP 測試
        run: npm run test:mcp

      - name: 正式建置
        run: npm run build
